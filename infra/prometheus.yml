# TubeForge AI — Prometheus scrape configuration.
# Enable with: docker compose --profile observability up -d prometheus node-exporter
# The api service exposes Prometheus metrics at /api/v1/metrics (Django view,
# no auth required from inside the cluster; Caddy does NOT proxy this path).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tubeforge
    replica: "0"

# To enable alerting: save the commented rule block at the bottom of this file
# as infra/alerts.yml and uncomment the rule_files line below.
# rule_files:
#   - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django API: request latency, workflow run counters, queue depth gauges,
  # provider spend counters, render job durations. Metrics path is
  # /api/v1/metrics (see backend metrics view).
  - job_name: tubeforge-api
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Temporal server metrics (SDK + server stats on :9090).
  - job_name: temporal
    static_configs:
      - targets: ["temporal:9090"]
        labels:
          service: temporal

  # Host-level metrics. node-exporter only runs with --profile observability.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

