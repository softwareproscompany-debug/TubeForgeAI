[mypy]
# The CI typecheck job installs only `mypy django-stubs` (no Django or backend
# deps), so the mypy_django_plugin cannot import the settings module there.
# Without the plugin, mypy cannot understand Django model field descriptors,
# which produces hundreds of false-positive [var-annotated] errors. Disable
# that code; the plugin remains the right choice for local dev with Django
# installed (see below).
disable_error_code = var-annotated
ignore_missing_imports = True
warn_unused_ignores = True

# Local dev with Django installed: uncomment to enable the Django plugin.
# [mypy.plugins.django-stubs]
# django_settings_module = "config.settings"
